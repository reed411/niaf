      color: var(--text-dark);
      line-height: 1.4;

      position: relative;
      overflow-x: hidden;
    }

    header {

    }

    .header-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .tournament-badge {
      border: 2px solid var(--masters-yellow);
      padding: 4px 15px;
      border-radius: 20px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--masters-yellow);
      font-weight: 700;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--masters-yellow);
      text-transform: uppercase;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
      margin-top: 4px;
    }

    header p.sub {
      font-size: 0.9rem;
      color: #f0f0f0;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
    }

    header p.location {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: var(--masters-gold);
      margin-top: 4px;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .motto-banner {
      background-color: #041f13;
      color: #f2c94c;
      text-align: center;
      padding: 8px;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      border-bottom: 2px solid var(--masters-gold);
    }

      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;

      border-bottom: 3px solid var(--masters-green);
    }

      padding: 0 12px;
