<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The NIAF Invitational | Onion Creek Club</title>

  <style>
    :root {
      --masters-green: #0a3825;
      --masters-dark: #041a12;
      --masters-yellow: #f2c94c;
      --masters-gold: #d4af37;
      --masters-cream: #fbf9f4;
      --masters-light: #f0ede4;
      --masters-border: #d2c8b8;
      --text-dark: #1c2b22;
      --text-muted: #57685d;
      --card-bg: #ffffff;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--masters-cream);
      color: var(--text-dark);
      line-height: 1.5;
      padding-bottom: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* HEADER BANNER WITH ONION CREEK HERO IMAGE */
    header {
      background: linear-gradient(180deg, rgba(4, 26, 18, 0.82) 0%, rgba(10, 56, 37, 0.92) 100%),
                  url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
      color: white;
      text-align: center;
      padding: 50px 20px 40px;
      border-bottom: 6px solid var(--masters-yellow);
      position: relative;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .header-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    /* PRIDE FLAG GOLF FLAGS */
    .pride-flag-icon {
      width: 42px;
      height: 28px;
      background: linear-gradient(
        to bottom,
        #e74c3c 0% 16.6%,
        #e67e22 16.6% 33.3%,
        #f1c40f 33.3% 50%,
        #2ecc71 50% 66.6%,
        #3498db 66.6% 83.3%,
        #9b59b6 83.3% 100%
      );
      clip-path: polygon(0 0, 100% 15%, 85% 50%, 100% 85%, 0 100%);
      border-left: 4px solid #dcdde1;
      filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.4));
      transform: rotate(-5deg);
      transition: transform 0.3s ease;
    }

    .pride-flag-icon:hover {
      transform: rotate(5deg) scale(1.1);
    }

    .badge-container {
      display: inline-block;
    }

      border: 2px solid var(--masters-yellow);
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      letter-spacing: 2.5px;
